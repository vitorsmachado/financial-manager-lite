<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-sm" style="width: 420px;">
        <div class="card-body p-4 text-center">
            <i class="bi bi-exclamation-triangle text-warning" style="font-size:2.5rem;"></i>
            <h4 class="mt-2 fw-bold"
                th:text="${status == 404} ? 'Página não encontrada' : 'Algo deu errado'">Algo deu errado</h4>
            <p class="text-muted small"
               th:text="${errorMessage != null} ? ${errorMessage}
                        : (${status == 404} ? 'O endereço acessado não existe.' : 'Ocorreu um erro inesperado. Tente novamente.')">
                Ocorreu um erro inesperado. Tente novamente.
            </p>
            <a th:href="@{/dashboard}" class="btn btn-primary fw-semibold mt-2">
                <i class="bi bi-house me-2"></i>Voltar ao início
            </a>
        </div>
    </div>
</div>

</body>
</html>
